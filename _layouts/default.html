  animation: move-it 10s linear infinite;
}

  background: repeating-linear-gradient(
  -45deg,
  #0f0f0f,
  #0f0f0f 5%,
  #000000 5%,
  #000000 10%
);
  background-size: 100px 100px;
  animation: move-it 10s linear infinite;
}
</style>
